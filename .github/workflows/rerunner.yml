name: rerunner
on:
  workflow_dispatch:
    inputs:
      run: { required: true }
permissions:
  actions: write
jobs:
  rerun:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.run }}
        run: gh api -X POST "repos/${{ github.repository }}/actions/runs/$RUN/rerun-failed-jobs"
